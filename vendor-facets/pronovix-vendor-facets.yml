earns_nothing:
- feature: markdownify
  check: examples_present
  why: Inlining an attached OpenAPI into Markdown republishes the contract. It adds no examples to it.
- feature: zero-gravity-portal
  check: contract_present
  why: The portal renders a contract the provider already has. It creates none.
