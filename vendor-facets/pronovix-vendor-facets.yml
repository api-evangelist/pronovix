# Vendor facets — Pronovix. Builds Drupal-based developer portals (Zero Gravity, and portals for
# Apigee and Azure API Management) as a services firm. The headline: a full set of server-rendered
# portal pointers, sign-up and key management through the gateway, and an llms.txt module the
# provider configures, open-sourced as a Drupal recipe. It cannot touch the contract, SDKs or MCP.
vendor: pronovix
name: Pronovix
website: https://pronovix.com
areas:
- developer-portal
registry_keys:
- pronovix
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  A Pronovix portal is a Drupal site the provider owns, so what it publishes is on the provider's own
  surface: API catalog, OpenAPI reference with "try it out", release notes, a blog and gateway key management.
  Each scores once declared in apis.yml. Sign-up counts only where the portal fronts a gateway (Apigee,
  Azure) that issues keys. The llms.txt module has sections and a header the provider edits, which makes
  it first-party. Markdownify adds .md twins that no check reads. Pronovix renders the contract and cannot
  improve it; SDKs, CLIs and MCP servers are out of reach.
features:
- id: zero-gravity-portal
  name: Zero Gravity developer portal
  description: >-
    A Drupal portal with an API catalog, OpenAPI reference and code visualisation, "try it out", site
    search, release notes, blog, FAQ, localisation and docs-as-code workflows.
  source: https://pronovix.com/developer-portals
  tier: paid
- id: gateway-key-management
  name: Gateway-integrated app and key management
  description: API key and app management through Apigee (and Azure API Management) from the portal.
  source: https://pronovix.com/developer-portals
  tier: paid
- id: apigee-portal
  name: Apigee developer portal
  description: >-
    A Google Cloud partner portal adding app-approval workflows, granular access control and monetisation
    documentation to Apigee.
  source: https://pronovix.com/apigee-developer-portals
  tier: paid
- id: llms-txt-recipe
  name: llms.txt Drupal module and LLM Support recipe
  description: >-
    An open-sourced llms_txt module with an editable header and sections, served at /llms.txt, bundled
    with Markdownify in a Drupal recipe (June 2025).
  source: https://pronovix.com/articles/make-your-developer-portal-ready-ai-agents
  tier: open-source
- id: markdownify
  name: Markdownify
  description: Serves each page as Markdown at a .md URL, and inlines attached OpenAPI files as code blocks.
  source: https://pronovix.com/articles/make-your-developer-portal-ready-ai-agents
  tier: open-source
